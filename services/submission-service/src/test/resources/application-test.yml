spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 0
    consumer:
      auto-startup: false
    listener:
      auto-startup: false

jwt:
  public-key: ""

submission:
  rate-limit:
    max-requests: 100
    window-seconds: 60

logging:
  level:
    com.algoverse: DEBUG
    org.testcontainers: INFO
    org.springframework.test: DEBUG

server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: execution-service

  datasource:
    url: ${EXECUTION_DB_URL:jdbc:postgresql://localhost:5432/algoverse_execution}
    username: ${EXECUTION_DB_USER:postgres}
    password: ${EXECUTION_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

jwt:
  public-key: ${JWT_PUBLIC_KEY}

sandbox:
  docker-image: ${SANDBOX_IMAGE:algoverse/sandbox:latest}
  runtime: ${SANDBOX_RUNTIME:runsc}
  memory-limit-mb: 256
  cpu-limit: "0.5"
  timeout-seconds: 10
  network-disabled: true

problem-service:
  base-url: ${PROBLEM_SERVICE_URL:http://problem-service:8082}

execution:
  max-concurrent: 50
  quota-per-user-per-hour: 30
  run-quota-per-user-per-hour: 60

resilience4j:
  circuitbreaker:
    instances:
      kafka-producer:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.algoverse.execution: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

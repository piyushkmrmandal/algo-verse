spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-startup: false
    listener:
      auto-startup: false

logging:
  level:
    com.algoverse: DEBUG
    org.testcontainers: INFO
    org.springframework.test: DEBUG

##############################################################################
# AlgoVerse — Full Local Dev Stack
# Usage: make up       (start everything)
#        make down     (stop everything)
#        make clean    (remove containers + volumes)
##############################################################################

x-common-env: &common-env
  TZ: UTC

networks:
  algoverse-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  mongodb_data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: algoverse-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER:-algoverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-algoverse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algoverse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - algoverse-net

  redis:
    image: redis:7-alpine
    container_name: algoverse-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - algoverse-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: algoverse-zookeeper
    restart: unless-stopped
    environment:
      <<: *common-env
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - algoverse-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: algoverse-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      <<: *common-env
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - algoverse-net

  kafka-setup:
    image: confluentinc/cp-kafka:7.6.0
    container_name: algoverse-kafka-setup
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - algoverse-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: algoverse-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      <<: *common-env
      KAFKA_CLUSTERS_0_NAME: algoverse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - algoverse-net

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: algoverse-elasticsearch
    restart: unless-stopped
    environment:
      <<: *common-env
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - algoverse-net

  mongodb:
    image: mongo:7
    container_name: algoverse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - algoverse-net

  # ──────────────────────────────────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: algoverse-auth-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:postgresql://postgres:5432/auth_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-algoverse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-256-bit-key}
      SERVER_PORT: 8081
    networks:
      - algoverse-net

  problem-service:
    build:
      context: ./services/problem-service
      dockerfile: Dockerfile
    container_name: algoverse-problem-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: ${PROBLEM_DB_URL:-jdbc:postgresql://postgres:5432/problem_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-algoverse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_ELASTICSEARCH_URIS: http://${ELASTICSEARCH_HOST:-elasticsearch}:9200
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/problemdb}
      SERVER_PORT: 8082
    networks:
      - algoverse-net

  submission-service:
    build:
      context: ./services/submission-service
      dockerfile: Dockerfile
    container_name: algoverse-submission-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: ${SUBMISSION_DB_URL:-jdbc:postgresql://postgres:5432/submission_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-algoverse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8083
    networks:
      - algoverse-net

  gamification-service:
    build:
      context: ./services/gamification-service
      dockerfile: Dockerfile
    container_name: algoverse-gamification-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: ${GAMIFICATION_DB_URL:-jdbc:postgresql://postgres:5432/gamification_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-algoverse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8084
    networks:
      - algoverse-net

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: algoverse-ai-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      AI_DB_URL: ${AI_DB_URL:-postgresql+asyncpg://algoverse:secret@postgres:5432/ai_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - algoverse-net

  sysdesign-service:
    build:
      context: ./services/sysdesign-service
      dockerfile: Dockerfile
    container_name: algoverse-sysdesign-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      SYSDESIGN_DB_URL: ${SYSDESIGN_DB_URL:-jdbc:postgresql://postgres:5432/sysdesign_db}
      DB_USERNAME: ${POSTGRES_USER:-algoverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/sysdesigndb}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8090}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SERVER_PORT: 8086
    networks:
      - algoverse-net

  execution-service:
    build:
      context: ./services/execution-service
      dockerfile: Dockerfile
    container_name: algoverse-execution-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      EXECUTION_DB_URL: ${EXECUTION_DB_URL:-jdbc:postgresql://postgres:5432/execution_db}
      EXECUTION_DB_USER: ${POSTGRES_USER:-algoverse}
      EXECUTION_DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      PROBLEM_SERVICE_URL: http://problem-service:8082
      SERVER_PORT: 8087
    networks:
      - algoverse-net

  collaboration-service:
    build:
      context: ./services/collaboration-service
      dockerfile: Dockerfile
    container_name: algoverse-collaboration-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      <<: *common-env
      COLLAB_DB_URL: ${COLLAB_DB_URL:-jdbc:postgresql://postgres:5432/collaboration_db}
      DB_USERNAME: ${POSTGRES_USER:-algoverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SERVER_PORT: 8088
    networks:
      - algoverse-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: algoverse-notification-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DB_URL:-jdbc:postgresql://postgres:5432/notification_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-algoverse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8091
    networks:
      - algoverse-net

  visualization-service:
    build:
      context: ./services/visualization-service
      dockerfile: Dockerfile
    container_name: algoverse-visualization-service
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8092:8092"
    environment:
      <<: *common-env
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      TRACE_TIMEOUT_SECONDS: 10
      TRACE_MAX_STEPS: 500
      SERVER_PORT: 8092
    networks:
      - algoverse-net

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend (commented out — run with `make web` or `npm run dev`)

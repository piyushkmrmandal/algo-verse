##############################################################################
# AlgoVerse — Nginx API Gateway
#
# Single entry point on :80.  Proxies every service by URI prefix.
# WebSocket upgrades are handled for /ws-collab/**.
#
# Service routing map
# -------------------
#  /api/auth/**           → auth-service:8081
#  /api/problems/**       → problem-service:8082
#  /api/submissions/**    → submission-service:8083
#  /api/gamification/**   → gamification-service:8084
#  /api/analytics/**      → analytics-service:8085
#  /api/sysdesign/**      → sysdesign-service:8086
#  /api/execution/**      → execution-service:8087
#  /api/collab/**         → collaboration-service:8088
#  /ws-collab/**          → collaboration-service:8088  (WebSocket)
#  /api/ai/**             → ai-service:8090
#  /api/v1/notifications/** → notification-service:8091
#  /api/v1/visualize/**   → visualization-service:8092
##############################################################################

worker_processes auto;

events {
    worker_connections 4096;
    use                epoll;
    multi_accept       on;
}

http {
    # ── General settings ──────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml
                      application/xml+rss text/javascript;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m rate=20r/m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream auth_service          { server auth-service:8081;           keepalive 8; }
    upstream problem_service       { server problem-service:8082;        keepalive 8; }
    upstream submission_service    { server submission-service:8083;     keepalive 8; }
    upstream gamification_service  { server gamification-service:8084;   keepalive 8; }
    upstream analytics_service     { server analytics-service:8085;      keepalive 8; }
    upstream sysdesign_service     { server sysdesign-service:8086;      keepalive 8; }
    upstream execution_service     { server execution-service:8087;      keepalive 8; }
    upstream collaboration_service { server collaboration-service:8088;  keepalive 8; }
    upstream ai_service            { server ai-service:8090;             keepalive 4; }
    upstream notification_service  { server notification-service:8091;   keepalive 8; }
    upstream visualization_service { server visualization-service:8092;  keepalive 8; }

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Proxy defaults ────────────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Host               $host;
    proxy_set_header        X-Real-IP          $remote_addr;
    proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto  $scheme;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_buffering         off;

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health probe for load-balancer / k8s liveness
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Auth ──────────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth_service/api/auth/;
        }

        # ── Problems ──────────────────────────────────────────────────────────
        location /api/problems/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://problem_service/api/problems/;
        }

        # ── Submissions ───────────────────────────────────────────────────────
        location /api/submissions/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://submission_service/api/submissions/;
        }

        # ── Execution WebSocket (STOMP) ───────────────────────────────────────
        location /ws-exec/ {
            proxy_pass http://execution_service/ws-exec/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ── Gamification ──────────────────────────────────────────────────────
        location /api/gamification/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://gamification_service/api/gamification/;
        }

        # ── Analytics ─────────────────────────────────────────────────────────
        location /api/analytics/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://analytics_service/api/analytics/;
        }

        # ── System Design ─────────────────────────────────────────────────────
        location /api/sysdesign/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sysdesign_service/api/sysdesign/;
        }

        # ── Collaboration WebSocket (STOMP / OT) ──────────────────────────────
        location /ws-collab/ {
            proxy_pass http://collaboration_service/ws-collab/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ── Collaboration REST ────────────────────────────────────────────────
        location /api/collab/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://collaboration_service/api/collab/;
        }

        # ── AI service ────────────────────────────────────────────────────────
        location /api/ai/ {
            limit_req  zone=api burst=10 nodelay;
            proxy_pass http://ai_service/api/ai/;
            proxy_read_timeout 120s;   # LLM calls can be slow
        }

        # ── Notifications ─────────────────────────────────────────────────────
        location /api/v1/notifications/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://notification_service/api/v1/notifications/;
        }

        # ── Visualization / execution tracing ────────────────────────────────
        location /api/v1/visualize/ {
            limit_req  zone=api burst=10 nodelay;
            proxy_pass http://visualization_service/api/v1/visualize/;
            proxy_read_timeout 30s;
        }

        # ── Actuator (internal only — block from public) ──────────────────────
        location ~ ^/actuator {
            return 403;
        }

        # ── 404 fallback ──────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"Not Found"}';
            add_header Content-Type application/json;
        }
    }
}
